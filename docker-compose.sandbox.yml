version: '3.8'

services:
  # Traefik reverse proxy for routing sandbox instances
  traefik:
    image: traefik:v2.10
    container_name: sandbox-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "8080:80"      # Sandbox preview port
      - "8081:8080"    # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sandbox-network
    restart: unless-stopped

networks:
  sandbox-network:
    driver: bridge
    name: sandbox-network

